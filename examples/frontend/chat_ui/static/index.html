<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Chat UI</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="会话列表">
      <div class="brand">
        <img src="/static/app-icon.svg" alt="" />
        <div>
          <strong>AI Chat UI</strong>
          <span>学习工作台</span>
        </div>
      </div>
      <button class="new-session-button" id="new-session-button" type="button" title="新建会话">
        <span aria-hidden="true">＋</span>
        <span>新建会话</span>
      </button>
      <nav class="session-list" id="session-list" aria-label="会话"></nav>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <div>
          <label for="session-title">当前会话</label>
          <input id="session-title" class="session-title-input" value="" />
        </div>
        <button class="icon-button" id="save-title-button" type="button" title="保存标题" aria-label="保存标题">
          <span aria-hidden="true">✓</span>
        </button>
      </header>

      <section class="message-list" id="message-list" aria-live="polite"></section>

      <form class="composer" id="composer">
        <textarea id="message-input" placeholder="前端、任务状态、sources..."></textarea>
        <button class="send-button" type="submit" title="发送消息">
          <span aria-hidden="true">➤</span>
          <span>发送</span>
        </button>
      </form>
    </main>

    <aside class="inspector" aria-label="任务和来源">
      <section>
        <h2>任务状态</h2>
        <div class="task-status" id="task-status">暂无任务</div>
      </section>
      <section>
        <h2>Sources</h2>
        <div class="source-list" id="source-list">
          <p class="empty-note">暂无 sources</p>
        </div>
      </section>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
